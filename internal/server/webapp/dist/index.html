<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Today</title>
    <link rel="icon" href="favicon-light.png" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="favicon-dark.png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f4f6;
        color: #1c1c21;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 2rem;
      }
      h1 {
        font-size: 15px;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 0.75rem;
        color: #4b4b53;
      }
      code {
        display: inline-block;
        padding: 2px 6px;
        border-radius: 6px;
        background: #ffffff;
        border: 1px solid #e3e3e8;
        font-size: 12px;
        user-select: all;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1a1a1e;
          color: #ededf1;
        }
        p {
          color: #b9b9c1;
        }
        code {
          background: #232327;
          border-color: #333339;
        }
      }
    </style>
  </head>
  <body>
    <!-- Same mount point as the real bundle, so the shell is the same shape
         with or without a frontend build (tests rely on it). -->
    <div id="root"></div>
    <main>
      <h1>网页还没有构建</h1>
      <p>这个页面是占位：仓库里不放前端构建产物，免得装 Node 才能跑测试。</p>
      <p>构建一次就好：</p>
      <p><code>pnpm --dir frontend install &amp;&amp; pnpm --dir frontend build</code></p>
      <p>然后刷新。设备取帧、托盘菜单、API 都不受影响。</p>
    </main>
  </body>
</html>
