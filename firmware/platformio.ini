[env:esp32-s3-devkitc1-n16r8]
; Arduino-ESP32 3.x (ESP-IDF 5) via the pioarduino fork. If this exact release
; is unavailable, use the current pioarduino stable archive or Arduino IDE 3.x.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
; 16 MB flash + 8 MB octal PSRAM. The board talks over its built-in
; USB-Serial/JTAG port, so Serial has to be the USB CDC, not UART0.
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  zinggjm/GxEPD2@^1.6.0
  bblanchon/ArduinoJson@^7.2.0
