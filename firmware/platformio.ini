; Always-on build for the Waveshare ESP32-S3-RLCD-4.2 (ST7305, 16 MB flash,
; 8 MB OPI PSRAM). Arduino-ESP32 3.x via the pioarduino fork; the platform is
; pinned, do not upgrade it as part of a feature change.
;
; The board id is the generic S3 with the right memory sizes; pins live in
; include/board.h, not in the board manifest.
[env:esp32-s3-devkitc1-n16r8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  bblanchon/ArduinoJson@^7.2.0
; Version from the environment (release.sh sets TODAY_FW_VERSION); a local
; build gets 0.0.0-dev and therefore never OTA-upgrades itself.
extra_scripts = pre:pio_version.py
; Host-side packer/parser test (no Arduino):
;   clang++ -std=c++17 -Wall -Wextra -I firmware/src \
;     firmware/test/pack_test.cpp firmware/src/st7305.cpp firmware/src/tbf.cpp firmware/src/fontcheck.cpp firmware/src/netescape.cpp firmware/src/portal_plan.cpp firmware/src/sound_synth.cpp firmware/src/sound_policy.cpp firmware/src/screens.cpp \
;     -o /tmp/pack_test && /tmp/pack_test /tmp/frame.bin

; Timing and input-edge lines (setup: KEY held / portal: draw,pack,flush /
; painted screen ink / keys: KEY down|up) are compiled out by default. They are
; for diagnosing a board with a cable attached; a board in a kitchen only needs
; the event lines (reset reason, portal open/closed, ack failures).
;
;   pio run -e esp32-s3-devkitc1-n16r8-debug        # flash the talking build
;   pio run -e esp32-s3-devkitc1-n16r8-debug -t upload
[env:esp32-s3-devkitc1-n16r8-debug]
extends = env:esp32-s3-devkitc1-n16r8
build_flags =
  ${env:esp32-s3-devkitc1-n16r8.build_flags}
  -DTODAY_DEBUG_LOG=1
