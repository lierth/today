name: Cancel paused releases
on:
  push:
    branches: [main]
    paths: [.github/workflows/cancel-release.yml]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel this session's unfinished releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          for run in 45403292921 45401601387; do
            state=$(gh api "repos/lierth/today/actions/runs/$run" --jq .status)
            if [ "$state" != completed ]; then
              gh api --method POST "repos/lierth/today/actions/runs/$run/cancel"
            fi
          done
