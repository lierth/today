{{define "today_list.html"}}
{{if .HasProgress}}<p class="page-sub" id="today-progress" hx-swap-oob="true">{{.DateLabel}} · <span class="progress">{{.Done}} / {{.Total}}</span></p>{{end}}
<section id="today-list" class="card">
  {{if .Items}}
  <ul class="items">
    {{range .Items}}
    <li class="item{{if .Done}} done{{end}}">
      <form hx-patch="/api/items/{{.ID}}" hx-target="#today-list" hx-swap="outerHTML" hx-vals='{"view":"today"}'>
        <input type="hidden" name="status" value="{{if .Done}}open{{else}}done{{end}}">
        <button class="check" type="submit" aria-pressed="{{if .Done}}true{{else}}false{{end}}" aria-label="{{if .Done}}标记为未完成：{{else}}标记为完成：{{end}}{{.Title}}">{{if .Done}}✓{{end}}</button>
      </form>
      <div class="time">{{if .AllDay}}全天{{else}}{{timeLabel .}}{{end}}</div>
      <div class="title"><a href="/items/{{.ID}}">{{.Title}}</a></div>
    </li>
    {{end}}
  </ul>
  {{else}}
  <p class="empty">今天没有事项</p>
  {{end}}
</section>
{{end}}
