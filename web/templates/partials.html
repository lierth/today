{{define "head"}}
<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"4..","swap":true,"error":true},{"code":"5..","swap":false,"error":true},{"code":"...","swap":false}]}'>
<title>{{.Title}} · Today</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js" defer></script>
</head>
<body>
<main class="wrap">
  <div class="top">
    <a class="brand" href="/app">今天<small>Today</small></a>
    <nav class="tabs">
      <a href="/app" {{if eq .Nav "today"}}class="active"{{end}}>今日</a>
      <a href="/items" {{if eq .Nav "items"}}class="active"{{end}}>事项</a>
      <a href="/history" {{if eq .Nav "history"}}class="active"{{end}}>历史</a>
      <a href="/settings" {{if eq .Nav "settings"}}class="active"{{end}}>设置</a>
    </nav>
  </div>
  {{template "flash" .}}
{{end}}

{{define "foot"}}
</main>
<footer class="foot">
  <span>Today · 本地优先 · 墨水屏</span>
  <a href="/healthz">healthz</a>
</footer>
</body>
</html>
{{end}}

{{define "flash"}}
{{if .Message}}<p class="flash">{{.Message}}</p>{{end}}
{{if .Error}}<p class="flash error">{{.Error}}</p>{{end}}
{{end}}
