{{define "items.html"}}{{template "head" .}}
<h1 class="page-title">事项</h1>
<p class="page-sub">全部事项，含已完成与重复规则。重复实例由服务端每天物化。</p>

<div class="card">
  <form class="quick quick-items" hx-post="/api/items" hx-target="#items-list" hx-swap="outerHTML" hx-vals='{"view":"items"}' hx-on::after-request="if (event.detail.successful) this.reset()">
    <input type="text" name="title" placeholder="新事项…" maxlength="200" required autocomplete="off" aria-label="标题">
    <input type="date" name="date" aria-label="日期">
    <input type="time" name="time" aria-label="时间">
    <select name="rrule" aria-label="重复">
      <option value="">不重复</option>
      <option value="FREQ=DAILY">每天</option>
      <option value="FREQ=WEEKLY">每周</option>
      <option value="FREQ=MONTHLY">每月</option>
    </select>
    <button type="submit">添加</button>
  </form>
</div>

{{template "items_list.html" .}}
{{template "foot" .}}{{end}}
