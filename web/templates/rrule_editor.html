{{define "rrule_editor.html"}}
<div class="wide rrule-editor" data-rrule-editor>
  <label class="rrule-label">重复</label>
  <select name="rrule_preset" aria-label="重复方式"
          onchange="(function(sel){var box=sel.closest('.rrule-editor');var custom=box.querySelector('.rrule-custom');custom.hidden = sel.value !== 'custom';var hidden=box.querySelector('.rrule-value');if(sel.value!=='custom'){hidden.value=sel.value;}})(this)">
    {{$cur := .RRule}}
    {{$preset := "none"}}
    {{if eq $cur "FREQ=DAILY"}}{{$preset = "FREQ=DAILY"}}
    {{else if eq $cur "FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR"}}{{$preset = "weekdays"}}
    {{else if eq $cur "FREQ=WEEKLY;INTERVAL=1"}}{{$preset = "weekly"}}
    {{else if eq $cur "FREQ=MONTHLY;INTERVAL=1"}}{{$preset = "monthly"}}
    {{else if ne $cur ""}}{{$preset = "custom"}}
    {{end}}
    <option value="" {{if eq $preset "none"}}selected{{end}}>不重复</option>
    <option value="FREQ=DAILY" {{if eq $preset "FREQ=DAILY"}}selected{{end}}>每天</option>
    <option value="weekdays" {{if eq $preset "weekdays"}}selected{{end}}>工作日（周一至周五）</option>
    <option value="FREQ=WEEKLY;INTERVAL=1" {{if eq $preset "weekly"}}selected{{end}}>每周</option>
    <option value="FREQ=MONTHLY;INTERVAL=1" {{if eq $preset "monthly"}}selected{{end}}>每月</option>
    <option value="custom" {{if eq $preset "custom"}}selected{{end}}>自定义…</option>
  </select>
  <input type="hidden" class="rrule-value" name="rrule" value="{{$cur}}">

  <div class="rrule-custom" {{if ne $preset "custom"}}hidden{{end}}>
    <div class="rrule-line">
      <span>每</span>
      <input type="number" min="1" max="365" value="{{rruleNumber $cur "INTERVAL" 1}}" aria-label="间隔" class="rrule-interval">
      <select class="rrule-freq" aria-label="单位">
        <option value="DAILY" {{if rruleHasFreq $cur "DAILY"}}selected{{end}}>天</option>
        <option value="WEEKLY" {{if or (rruleHasFreq $cur "WEEKLY") (eq $cur "")}}selected{{end}}>周</option>
        <option value="MONTHLY" {{if rruleHasFreq $cur "MONTHLY"}}selected{{end}}>月</option>
      </select>
    </div>
    <div class="rrule-line rrule-days">
      <span>星期</span>
      {{$days := rruleByDay $cur}}
      <label><input type="checkbox" value="MO" {{if rruleDayOn $days "MO"}}checked{{end}}>一</label>
      <label><input type="checkbox" value="TU" {{if rruleDayOn $days "TU"}}checked{{end}}>二</label>
      <label><input type="checkbox" value="WE" {{if rruleDayOn $days "WE"}}checked{{end}}>三</label>
      <label><input type="checkbox" value="TH" {{if rruleDayOn $days "TH"}}checked{{end}}>四</label>
      <label><input type="checkbox" value="FR" {{if rruleDayOn $days "FR"}}checked{{end}}>五</label>
      <label><input type="checkbox" value="SA" {{if rruleDayOn $days "SA"}}checked{{end}}>六</label>
      <label><input type="checkbox" value="SU" {{if rruleDayOn $days "SU"}}checked{{end}}>日</label>
    </div>
    <div class="rrule-line">
      <span>结束</span>
      <select class="rrule-end" aria-label="结束方式"
              onchange="(function(sel){var box=sel.closest('.rrule-editor');box.querySelector('.end-count').hidden = sel.value !== 'count';box.querySelector('.end-until').hidden = sel.value !== 'until';})(this)">
        <option value="never" {{if not (rruleNumber $cur "COUNT" 0)}}{{if not (rruleUntil $cur)}}selected{{end}}{{end}}>永不</option>
        <option value="count" {{if rruleNumber $cur "COUNT" 0}}selected{{end}}>N 次后</option>
        <option value="until" {{if rruleUntil $cur}}selected{{end}}>指定日期</option>
      </select>
      <input type="number" class="end-count" min="1" max="10000" value="{{rruleNumber $cur "COUNT" 10}}" aria-label="次数" {{if not (rruleNumber $cur "COUNT" 0)}}hidden{{end}}>
      <input type="date" class="end-until" value="{{rruleUntil $cur}}" aria-label="结束日期" {{if not (rruleUntil $cur)}}hidden{{end}}>
    </div>
    <div class="hint">自定义规则由上面三项拼成；填完点「保存」才会写入。</div>
  </div>
</div>
{{end}}
