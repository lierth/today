<?xml version="1.0" encoding="UTF-8"?>
<!--
  Today app icon. The visual language is one reflective screen: warm paper,
  ink, and one accent for "done". Round checkbox everywhere.

  Rendered to resources/icon.png by resources/gen/render.sh (rsvg-convert).
  macOS grid: 1024 canvas, 824x824 rounded body (r=185), centered, with a soft
  shadow at the bottom. Edit this file, then re-run the script.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <!-- rsvg-convert ignores feDropShadow, so the shadow is an explicit
         blurred rounded rect behind the body. -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="body">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <rect x="108" y="128" width="808" height="808" rx="180" ry="180"
        fill="#1B1B19" opacity="0.16" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="#F4F3EE"/>

  <g clip-path="url(#body)">
    <!-- Screen: the board's own 400x300 panel, scaled and centered. -->
    <rect x="188" y="238" width="648" height="486" rx="34" ry="34"
          fill="#FBFBF7" stroke="#1B1B19" stroke-width="14"/>

    <!-- Date bar: thin rule under a short bold line, like the header. -->
    <rect x="236" y="286" width="212" height="26" rx="6" ry="6" fill="#1B1B19"/>
    <rect x="236" y="330" width="128" height="14" rx="7" ry="7" fill="#1B1B19" opacity="0.45"/>
    <rect x="236" y="352" width="552" height="3" rx="1.5" ry="1.5" fill="#1B1B19" opacity="0.35"/>

    <!-- Row 1: done. Filled circle with a tick drawn in paper colour. -->
    <circle cx="266" cy="424" r="30" fill="#1B1B19"/>
    <path d="M252 424 l10 11 l19 -22" fill="none" stroke="#F4F3EE" stroke-width="10"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="326" y="410" width="330" height="28" rx="8" ry="8" fill="#1B1B19"/>

    <!-- Row 2: open. Hollow circle, full-width title. -->
    <circle cx="266" cy="520" r="27" fill="none" stroke="#1B1B19" stroke-width="11"/>
    <rect x="326" y="506" width="430" height="28" rx="8" ry="8" fill="#1B1B19"/>

    <!-- Row 3: open, with the accent underline the web UI uses for a pinned item. -->
    <circle cx="266" cy="616" r="27" fill="none" stroke="#1B1B19" stroke-width="11"/>
    <rect x="326" y="602" width="286" height="28" rx="8" ry="8" fill="#1B1B19"/>
    <rect x="326" y="640" width="120" height="8" rx="4" ry="4" fill="#C2410C"/>
  </g>
</svg>
